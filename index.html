
<style>
:root{
  --bg:#06140f;
  --panel:#10251c;
  --panel2:#142e23;
  --line:#31513d;
  --text:#f5f2e8;
  --muted:#a5b6a7;
  --mint:#82d8a7;
  --gold:#e8c77a;
  --blue:#91b9e8;
  --rose:#e99191;
  --shadow:0 18px 45px #0005;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(ellipse at 85% -8%,#28583b 0,transparent 32%),
    radial-gradient(ellipse at 0 35%,#153d2b 0,transparent 28%),
    linear-gradient(145deg,#06140f,#091b13 55%,#07150f);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
  min-height:100vh;
}
button,input,select{font:inherit}
button{cursor:pointer;transition:.22s ease}
button:active{transform:scale(.97)}
.app{max-width:1120px;margin:auto;padding:18px 15px 45px}

/* سربرگ */
.top{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin:8px 0 22px
}
.brand{display:flex;align-items:center;gap:13px}
.logo{
  width:52px;height:52px;border-radius:18px;
  display:grid;place-items:center;
  color:#172416;font-size:27px;font-weight:900;
  background:linear-gradient(145deg,#fff0bd,#d5ad54 55%,#8c682d);
  box-shadow:0 5px 24px #d6b65b35,inset 0 1px 3px #fff9;
  border:1px solid #f6df9b;
}
.brand h1{
  font-size:22px;margin:0;
  background:linear-gradient(90deg,#fff1c6,#dfbd70);
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.brand p{margin:5px 0 0;color:var(--muted);font-size:11px}
.date-pill,.chip{
  border:1px solid #6c6843;background:#172b20;
  color:#ead9a9;border-radius:14px;padding:9px 13px;font-size:11px
}

/* کارت اصلی */
.hero{
  position:relative;overflow:hidden;
  border:1px solid #a78c4c;
  background:
    radial-gradient(circle at 90% 10%,#547b453d,transparent 38%),
    linear-gradient(125deg,#193c29,#10271d 58%,#263923);
  border-radius:28px;padding:24px;
  box-shadow:0 20px 55px #0006,inset 0 1px #ffffff18;
}
.hero:after{
  content:"";position:absolute;width:190px;height:190px;
  border:1px solid #e8c77a25;border-radius:50%;
  left:-65px;bottom:-115px;
  box-shadow:0 0 0 18px #e8c77a08,0 0 0 38px #e8c77a06;
  pointer-events:none
}
.hero-head{display:flex;justify-content:space-between;gap:10px}
.eyebrow{color:#d8c48c;font-size:12px}
.hero h2{font-size:23px;margin:8px 0 4px}
.sub,.hint{font-size:11px;color:var(--muted)}
.hero-value{
  font-size:clamp(30px,6vw,42px);font-weight:900;
  margin:22px 0 13px;letter-spacing:.4px;
  color:#fff0c2;text-shadow:0 4px 20px #e8c77a30;
  overflow-wrap:anywhere
}
.unit{font-size:12px;color:#d6c99e}
.hero-foot{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#ffffff0c;border-color:#ffffff20;color:#e9dfc3}

/* صندوق‌ها */
.grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:13px;margin:14px 0
}
.wallet{
  position:relative;overflow:hidden;min-width:0;
  border:1px solid #355743;border-radius:21px;padding:17px;
  background:linear-gradient(150deg,#193729,#10251b 75%);
  box-shadow:0 10px 28px #0003,inset 0 1px #ffffff0c;
  transition:transform .25s,border-color .25s
}
.wallet:hover{transform:translateY(-3px);border-color:#b79a57}
.wallet-top{display:flex;justify-content:space-between;align-items:center}
.wallet-icon{
  width:39px;height:39px;border-radius:14px;
  display:grid;place-items:center;background:#ffffff0c;
  border:1px solid #ffffff12;font-size:18px
}
.wallet small{color:var(--muted);font-size:11px}
.wallet strong{
  display:block;font-size:22px;margin:15px 0 5px;
  overflow-wrap:anywhere
}
.mint{color:var(--mint)}
.gold{color:var(--gold)}
.blue{color:var(--blue)}
.rose{color:var(--rose)}

/* بخش‌ها و پنل‌ها */
.section{margin-top:19px}
.section-title{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin:0 3px 11px
}
.section-title h3{font-size:15px;margin:0;color:#f1e6c6}
.section-title span{font-size:10px;color:var(--muted)}
.panel{
  background:linear-gradient(145deg,#142d21ed,#0d2118);
  border:1px solid #31503b;border-radius:21px;
  padding:16px;box-shadow:var(--shadow),inset 0 1px #ffffff08
}
.panel h3{font-size:13px;color:#e8d7a7;margin:2px 0 12px}

/* منوی بخش‌ها */
.tabs{
  display:flex;gap:8px;overflow-x:auto;
  padding:5px 1px 12px;margin:17px 0 5px;
  scrollbar-width:thin;scrollbar-color:#8d7542 transparent
}
.tab{
  flex:0 0 auto;border:1px solid #34533d;
  background:linear-gradient(145deg,#152c20,#102219);
  color:#b9c8b8;border-radius:14px;
  padding:11px 15px;white-space:nowrap;font-size:11px;
  box-shadow:0 4px 12px #0002
}
.tab.active{
  background:linear-gradient(120deg,#f4dfa0,#c49b4e);
  color:#182518;font-weight:900;border-color:#f5dfa0;
  box-shadow:0 5px 18px #d4b45b35
}
.view{display:none;animation:appear .25s ease}
.view.active{display:block}
@keyframes appear{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:translateY(0)}
}

/* ورودی‌ها */
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.field label{font-size:11px;color:#c5d2c2}
.field input,.field select{
  width:100%;border:1px solid #3a5a43;border-radius:13px;
  padding:12px;background:#091b12;color:var(--text);
  outline:none;min-height:45px;transition:.2s
}
.field input:focus,.field select:focus{
  border-color:#d6b565;box-shadow:0 0 0 3px #d6b56518
}
.field input::placeholder{color:#718575}
.field input[type=checkbox]{
  width:18px;min-height:18px;accent-color:#d5b45f
}
.date-input{direction:ltr;text-align:left}

/* دکمه‌ها */
.btn{
  border:1px solid #f1d995;border-radius:13px;
  padding:12px 17px;
  background:linear-gradient(120deg,#f2dda0,#c49a4d);
  color:#1b291a;font-weight:900;
  box-shadow:0 5px 16px #c49a4d20
}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.secondary{
  background:linear-gradient(145deg,#203d2b,#142c1d);
  color:#e3e9dc;border:1px solid #45664b;box-shadow:none
}
.btn.danger{
  background:linear-gradient(145deg,#512b2b,#3a2021);
  color:#ffd0c9;border:1px solid #814747;box-shadow:none
}
.btn.small{padding:7px 10px;font-size:10px}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.notice{color:var(--muted);font-size:10px;line-height:1.9;margin-top:9px}
.date-help{font-size:10px;color:#cdbb82;margin-top:-4px}

/* آمار */
.statline{
  display:flex;justify-content:space-between;gap:10px;
  padding:11px 2px;border-bottom:1px solid #294637;
  font-size:11px
}
.statline:last-child{border:0}
.statline b{font-size:12px;color:#f0e6c9}

/* نمودارها */
.chart-wrap{
  min-height:175px;display:flex;align-items:center;
  justify-content:center;overflow:hidden
}
.chart-wrap svg{width:100%;height:auto;max-height:250px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.legend span{
  font-size:10px;color:var(--muted);
  display:flex;align-items:center;gap:6px
}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* تاریخچه و ردیف‌ها */
.records{display:flex;flex-direction:column;gap:8px}
.record{
  display:flex;justify-content:space-between;gap:8px;
  align-items:center;border:1px solid #34513d;
  background:linear-gradient(110deg,#172f22,#10251a);
  border-radius:14px;padding:11px
}
.record b{font-size:12px}
.record small{
  display:block;color:var(--muted);
  font-size:10px;margin-top:5px;line-height:1.7
}
.amount{font-weight:900;white-space:nowrap;font-size:11px;color:#e8d49b}
.empty{
  text-align:center;color:var(--muted);
  font-size:11px;padding:24px 8px
}

/* قرضه‌ها */
.loan-card{
  border:1px solid #3a5943;
  background:linear-gradient(145deg,#193528,#10241a);
  border-radius:17px;padding:14px;margin-bottom:10px;
  box-shadow:0 8px 22px #0002
}
.loan-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.loan-head b{font-size:13px;color:#f0e5c6}
.loan-meta{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.9}
.loan-numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.loan-numbers div{
  background:#ffffff08;border:1px solid #ffffff0a;
  border-radius:12px;padding:9px
}
.loan-numbers small{display:block;color:var(--muted);font-size:9px}
.loan-numbers strong{font-size:12px;display:block;margin-top:5px}
.loan-history{border-top:1px solid #34513d;padding-top:9px;margin-top:9px}
.loan-history summary{font-size:10px;color:#e1d09c;cursor:pointer}
.loan-history .record{margin-top:7px}

/* پایان صفحه */
footer{
  text-align:center;color:#829787;font-size:10px;
  margin:30px 0 5px;padding-top:16px;
  border-top:1px solid #294334
}

/* موبایل */
@media(max-width:680px){
  .app{padding:12px 11px 35px}
  .brand h1{font-size:19px}
  .brand p{font-size:10px}
  .logo{width:46px;height:46px;border-radius:15px}
  .date-pill{font-size:10px;padding:8px}
  .grid{grid-template-columns:1fr 1fr;gap:9px}
  .wallet{padding:13px;border-radius:17px}
  .wallet:last-child{grid-column:span 2}
  .wallet strong{font-size:20px}
  .hero{padding:19px;border-radius:23px}
  .hero-value{font-size:30px}
  .hero h2{font-size:21px}
  .two{grid-template-columns:1fr;gap:0}
  .panel{padding:13px;border-radius:18px}
  .section-title h3{font-size:14px}
  .tabs{margin-top:14px}
  .tab{padding:10px 13px}
  .loan-numbers{gap:5px}
  .loan-numbers div{padding:7px}
}
@media(min-width:681px){
  .tabs{justify-content:center}
}
</style>
